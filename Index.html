<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Productos</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f4f6f9; margin: 0; padding: 20px; color: #2c3e50; }
  .header { text-align: center; padding: 30px 20px; background: #2c3e50; color: #fff; border-radius: 12px; margin-bottom: 25px; }
  .header h1 { margin: 0; font-size: 28px; }
  .header p { margin: 8px 0 0; color: #bdc3c7; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
  .card {
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.08); transition: .2s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.12); }
  .card img { width: 100%; height: 200px; object-fit: cover; }
  .no-img { width: 100%; height: 200px; background: #ecf0f1; display: flex; align-items: center; justify-content: center; color: #bdc3c7; }
  .info { padding: 15px; flex: 1; display: flex; flex-direction: column; }
  .info h3 { margin: 0 0 8px; font-size: 17px; }
  .info .precio { font-size: 20px; color: #e74c3c; font-weight: bold; margin-bottom: 8px; }
  .info .desc { color: #7f8c8d; font-size: 13px; flex: 1; margin-bottom: 12px; }
  .btn-wsp {
    display: block; text-align: center; background: #25D366; color: #fff;
    padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .btn-wsp:hover { background: #1da851; }
  .vacio { text-align: center; padding: 60px; color: #aaa; }
</style>
</head>
<body>

<div class="header">
  <h1>🛍️ Catálogo de Productos</h1>
  <p>Contáctanos por WhatsApp para más información</p>
</div>

<div id="catalogo" class="grid"></div>

<script>
// ⚠️ CAMBIA ESTA URL por la de tu JSON en GitHub Pages
const URL_JSON = 'https://TU-USUARIO.github.io/TU-REPO/productos.json';

async function cargarCatalogo() {
  try {
    const res = await fetch(URL_JSON + '?v=' + Date.now()); // evita caché
    const productos = await res.json();
    renderizar(productos);
  } catch (e) {
    document.getElementById('catalogo').innerHTML =
      '<p class="vacio">No se pudo cargar el catálogo.</p>';
    console.error(e);
  }
}

function renderizar(productos) {
  const cont = document.getElementById('catalogo');
  if (!productos || productos.length === 0) {
    cont.innerHTML = '<p class="vacio">No hay productos disponibles.</p>';
    return;
  }
  cont.innerHTML = productos.map(p => {
    const msg = encodeURIComponent(`Hola, me interesa: ${p.nombre}`);
    const link = p.whatsapp ? `https://wa.me/${p.whatsapp}?text=${msg}` : '#';
    return `
      <div class="card">
        ${p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}">` : '<div class="no-img">Sin foto</div>'}
        <div class="info">
          <h3>${p.nombre}</h3>
          <div class="precio">Q ${p.precio}</div>
          <div class="desc">${p.descripcion || ''}</div>
          ${p.whatsapp ? `<a href="${link}" target="_blank" class="btn-wsp">💬 Más información</a>` : ''}
        </div>
      </div>`;
  }).join('');
}

cargarCatalogo();
</script>
</body>
</html>
